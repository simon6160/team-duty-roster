<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>球隊打掃值日生排班系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js 負責網頁互動 -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Barlow+Condensed:wght@600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #F6F3EC; color: #1F2A3C; }
        .font-display { font-family: 'Barlow Condensed', 'Noto Sans TC', sans-serif; }
        .font-mono { font-family: 'Roboto Mono', monospace; }
    </style>
</head>
<body x-data="rosterApp()" x-init="init()">

    <!-- Header -->
    <div class="bg-[#16233B] text-[#F6F3EC] px-6 py-7 relative overflow-hidden">
        <div class="absolute -right-8 -top-8 w-40 h-40 rounded-full bg-[#CFE85C] opacity-10"></div>
        <div class="max-w-6xl mx-auto relative">
            <div class="font-display uppercase tracking-widest text-xs text-[#CFE85C] mb-1">Team Duty Roster</div>
            <h1 class="font-display font-bold text-3xl sm:text-4xl uppercase tracking-wide">球隊打掃值日生排班助手</h1>
            <p class="text-sm text-[#B9C2D4] mt-1">自動避開球員固定補習或請假日期，輕鬆產出班表並一鍵複製公告。</p>
        </div>
        <div class="h-1 w-full bg-gradient-to-r from-[#CFE85C] via-[#5CC8E8] to-transparent mt-5 rounded-full"></div>
    </div>

    <!-- Main Container -->
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-6 grid grid-cols-1 lg:grid-cols-[340px_1fr] gap-6">
        
        <!-- 左側：球員管理 -->
        <div>
            <div class="flex items-center justify-between mb-3">
                <h2 class="font-display font-bold text-xl uppercase tracking-wide">球員名單</h2>
            </div>

            <!-- 新增球員卡片 -->
            <div class="bg-white rounded-xl border border-[#D8D3C6] p-4 mb-4 shadow-sm">
                <input type="text" x-model="newName" @keydown.enter="addPlayer()" placeholder="輸入球員姓名" class="w-full px-3 py-2 rounded-lg border border-[#D8D3C6] text-sm mb-3 outline-none focus:border-[#16233B]">
                <div class="text-xs text-[#6B7280] mb-1.5">固定無法打掃的星期（點擊選取）：</div>
                <div class="flex gap-1.5 mb-3 flex-wrap">
                    <template x-for="(label, wd) in ['日', '一', '二', '三', '四', '五', '六']">
                        <button type="button" @click="toggleNewOff(wd)" 
                            class="w-9 h-9 rounded-full text-sm font-medium border transition"
                            :class="newOffDays.includes(wd) ? 'bg-[#FF6B4A] text-white border-[#FF6B4A]' : 'bg-[#F6F3EC] text-[#1F2A3C] border-[#D8D3C6]'"
                            x-text="label">
                        </button>
                    </template>
                </div>
                <button @click="addPlayer()" class="w-full bg-[#16233B] text-[#CFE85C] font-medium py-2 rounded-lg text-sm hover:bg-[#0f1a2c] transition">
                    + 新增球員
                </button>
            </div>

            <!-- 球員列表 -->
            <div class="space-y-3">
                <template x-if="players.length === 0">
                    <div class="text-sm text-[#6B7280] italic px-1">尚未新增球員</div>
                </template>
                <template x-for="(p, index) in players" :key="p.id">
                    <div class="bg-white rounded-xl border border-[#D8D3C6] overflow-hidden shadow-sm">
                        <div class="flex items-center gap-2 px-3 py-2.5 border-l-4" :style="`border-left-color: ${p.color}`">
                            <div class="font-mono text-xs font-bold w-6 h-6 rounded-full flex items-center justify-center text-white shrink-0" :style="`background-color: ${p.color}`" x-text="index + 1"></div>
                            <div class="font-medium text-sm flex-1" x-text="p.name"></div>
                            <button @click="removePlayer(p.id)" class="text-[#9CA3AF] hover:text-[#FF6B4A]">🗑️</button>
                        </div>
                        <div class="px-3 pb-3">
                            <div class="flex gap-1 flex-wrap mb-2">
                                <template x-for="(label, wd) in ['日', '一', '二', '三', '四', '五', '六']">
                                    <button @click="togglePlayerOff(p.id, wd)" 
                                        class="w-7 h-7 rounded-full text-xs font-medium border transition"
                                        :class="p.offDays.includes(wd) ? 'bg-[#FF6B4A] text-white border-[#FF6B4A]' : 'bg-[#F6F3EC] text-[#1F2A3C] border-[#D8D3C6]'"
                                        x-text="label">
                                    </button>
                                </template>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- 右側：排班設定與結果 -->
        <div>
            <div class="flex items-center gap-2 mb-3">
                <h2 class="font-display font-bold text-xl uppercase tracking-wide">排班設定與班表</h2>
            </div>

            <!-- 設定面板 -->
            <div class="bg-white rounded-xl border border-[#D8D3C6] p-4 mb-5 shadow-sm">
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <div>
                        <div class="text-xs text-[#6B7280] mb-1">開始日期</div>
                        <input type="date" x-model="startDate" class="w-full text-sm px-2 py-1.5 rounded-md border border-[#D8D3C6] outline-none">
                    </div>
                    <div>
                        <div class="text-xs text-[#6B7280] mb-1">結束日期</div>
                        <input type="date" x-model="endDate" class="w-full text-sm px-2 py-1.5 rounded-md border border-[#D8D3C6] outline-none">
                    </div>
                </div>
                <div class="mb-3">
                    <div class="text-xs text-[#6B7280] mb-1.5">需要打掃的星期（可含週六，建議取消週日）</div>
                    <div class="flex gap-1.5 flex-wrap">
                        <template x-for="(label, wd) in ['日', '一', '二', '三', '四', '五', '六']">
                            <button type="button" @click="toggleDutyWd(wd)" 
                                class="w-9 h-9 rounded-full text-sm font-medium border transition"
                                :class="dutyWeekdays.includes(wd) ? 'bg-[#16233B] text-[#CFE85C] border-[#16233B]' : 'bg-[#F6F3EC] text-[#1F2A3C] border-[#D8D3C6]'"
                                x-text="label">
                            </button>
                        </template>
                    </div>
                </div>
                <div class="flex items-end justify-between">
                    <div>
                        <div class="text-xs text-[#6B7280] mb-1">每天打掃人數</div>
                        <input type="number" min="1" x-model.number="perDay" class="w-20 text-sm px-2 py-1.5 rounded-md border border-[#D8D3C6] outline-none">
                    </div>
                    <button @click="generateSchedule()" class="bg-[#CFE85C] text-[#16233B] font-bold text-sm px-5 py-2.5 rounded-lg hover:brightness-95 transition shadow-sm">
                        🚀 開始自動排班
                    </button>
                </div>
            </div>

            <!-- 排班結果輸出 -->
            <template x-if="scheduleRows.length > 0">
                <div class="bg-white rounded-xl border border-[#D8D3C6] overflow-hidden shadow-sm">
                    <div class="flex items-center justify-between px-4 py-3 border-b border-[#D8D3C6] bg-[#FBFAF6]">
                        <div class="font-display font-bold uppercase tracking-wide text-sm">排班公告預覽</div>
                        <button @click="copySchedule()" class="bg-[#16233B] text-[#F6F3EC] text-xs font-medium px-3 py-1.5 rounded-lg hover:bg-[#0f1a2c]">
                            📋 複製 LINE 公告文字
                        </button>
                    </div>
                    <div class="divide-y divide-[#EDE9DE] max-h-[500px] overflow-y-auto p-4 space-y-2">
                        <template x-for="row in scheduleRows" :key="row.date">
                            <div class="flex items-center justify-between text-sm py-1.5 border-b border-gray-100">
                                <span class="font-mono text-gray-600" x-text="row.dateStr"></span>
                                <span class="font-bold text-[#16233B]" x-text="row.names.length ? row.names.join('、') : '⚠️ 當日無人可排'"></span>
                            </div>
                        </template>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <!-- Toast 提示框 -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-[#16233B] text-[#F6F3EC] text-sm px-4 py-2 rounded-full shadow-lg hidden">
        已複製到剪貼簿！
    </div>

    <script>
        const JERSEY_COLORS = ["#CFE85C", "#5CC8E8", "#E85C9E", "#E8B95C", "#8C5CE8", "#5CE89A"];
        
        function rosterApp() {
            return {
                players: [],
                newName: '',
                newOffDays: [],
                startDate: new Date().toISOString().split('T')[0],
                endDate: new Date(Date.now() + 13*86400000).toISOString().split('T')[0],
                dutyWeekdays: [1, 2, 3, 4, 5, 6], // 預設週一至週六
                perDay: 1,
                scheduleRows: [],

                init() {
                    const saved = localStorage.getItem('team_players');
                    if (saved) this.players = JSON.parse(saved);
                },

                savePlayers() {
                    localStorage.setItem('team_players', JSON.stringify(this.players));
                },

                toggleNewOff(wd) {
                    if (this.newOffDays.includes(wd)) {
                        this.newOffDays = this.newOffDays.filter(d => d !== wd);
                    } else {
                        this.newOffDays.push(wd);
                    }
                },

                addPlayer() {
                    if (!this.newName.trim()) return;
                    this.players.push({
                        id: Date.now().toString(),
                        name: this.newName.trim(),
                        offDays: [...this.newOffDays],
                        color: JERSEY_COLORS[this.players.length % JERSEY_COLORS.length]
                    });
                    this.newName = '';
                    this.newOffDays = [];
                    this.savePlayers();
                },

                removePlayer(id) {
                    this.players = this.players.filter(p => p.id !== id);
                    this.savePlayers();
                },

                    togglePlayerOff(id, wd) {
                    const p = this.players.find(x => x.id === id);
                    if (p) {
                        if (p.offDays.includes(wd)) {
                            p.offDays = p.offDays.filter(d => d !== wd);
                        } else {
                            p.offDays.push(wd);
                        }
                        this.savePlayers();
                    }
                },

                toggleDutyWd(wd) {
                    if (this.dutyWeekdays.includes(wd)) {
                        this.dutyWeekdays = this.dutyWeekdays.filter(d => d !== wd);
                    } else {
                        this.dutyWeekdays.push(wd);
                        this.dutyWeekdays.sort();
                    }
                },

                generateSchedule() {
                    if (this.players.length === 0) {
                        alert('請先新增至少一位球員！');
                        return;
                    }

                    let counts = {};
                    this.players.forEach(p => counts[p.id] = 0);
                    
                    let results = [];
                    let cur = new Date(this.startDate);
                    let end = new Date(this.endDate);
                    let queueIdx = 0;

                    while (cur <= end) {
                        let wd = cur.getDay();
                        let dateKey = cur.toISOString().split('T')[0];
                        let wdNames = ['日', '一', '二', '三', '四', '五', '六'];

                        if (this.dutyWeekdays.includes(wd)) {
                            // 過濾今天有空的人
                            let available = this.players.filter(p => !p.offDays.includes(wd));
                            // 依照打掃次數排序（達成公平輪流）
                            available.sort((a, b) => counts[a.id] - counts[b.id]);

                            let chosen = [];
                            for (let i = 0; i < this.perDay && available.length > 0; i++) {
                                let target = available.shift();
                                chosen.push(target);
                                counts[target.id]++;
                            }

                            results.push({
                                dateStr: `${dateKey.slice(5)} (${wdNames[wd]})`,
                                names: chosen.map(c => c.name)
                            });
                        }
                        cur.setDate(cur.getDate() + 1);
                    }
                    this.scheduleRows = results;
                },

                copySchedule() {
                    let text = "📋 球隊打掃值日生班表\n";
                    this.scheduleRows.forEach(r => {
                        text += `${r.dateStr}：${r.names.length ? r.names.join('、') : '無人'}\n`;
                    });
                    navigator.clipboard.writeText(text).then(() => {
                        let t = document.getElementById('toast');
                        t.classList.remove('hidden');
                        setTimeout(() => t.classList.add('hidden'), 2000);
                    });
                }
            }
        }
    </script>
</body>
</html>
